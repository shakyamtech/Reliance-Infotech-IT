<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login — Reliance Infotech Portal</title>
    
    <link rel="icon" type="image/x-icon" href="/img/core-img/favicon.ico">
    <link rel="stylesheet" href="/css/font-awesome.min.css">
    <link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body class="adm-login-body">

    <div class="adm-login-card">
        <!-- Logo Link to Homepage -->
        <div class="adm-login-logo">
            <a href="/index.html" title="Return to Reliance Infotech Homepage">
                <img src="/img/core-img/logo.jpg" alt="Reliance Infotech Logo">
            </a>
        </div>

        <div class="adm-login-header">
            <h2>Reliance <span>CMS Portal</span></h2>
            <p>Enter your authorized credentials to manage website content and analytics.</p>
        </div>

        <!-- Error Alert -->
        <div id="loginAlert" class="adm-alert-error">
            <i class="fa fa-exclamation-triangle"></i> <span id="loginAlertText">Invalid credentials.</span>
        </div>

        <form id="loginForm">
            <div class="adm-form-group">
                <label for="usernameInput">Username or Work Email</label>
                <div class="adm-input-wrap">
                    <i class="fa fa-user adm-input-icon"></i>
                    <input type="text" id="usernameInput" class="adm-input" placeholder="admin or admin@relianceinfotech.com.np" required autofocus>
                </div>
            </div>

            <div class="adm-form-group">
                <label for="passwordInput">Secret Password</label>
                <div class="adm-input-wrap has-toggle">
                    <i class="fa fa-lock adm-input-icon"></i>
                    <input type="password" id="passwordInput" class="adm-input" placeholder="Enter password" required>
                    <!-- Eye Toggle for Show/Hide Password -->
                    <button type="button" id="togglePasswordBtn" class="adm-eye-toggle" title="Show/Hide Password" aria-label="Toggle password visibility">
                        <i class="fa fa-eye" id="toggleIcon"></i>
                    </button>
                </div>
            </div>

            <div class="adm-login-meta">
                <label class="adm-remember">
                    <input type="checkbox" id="rememberMe">
                    <span>Keep me logged in</span>
                </label>
                <a href="#" id="forgotPassBtn" style="font-size:12px;">Forgot password?</a>
            </div>

            <button type="submit" id="submitLoginBtn" class="adm-btn-primary">
                <span>Sign In to Dashboard</span> <i class="fa fa-arrow-right"></i>
            </button>
        </form>

        <div class="adm-login-footer">
            <a href="/index.html">
                <i class="fa fa-angle-left"></i> Back to Public Website
            </a>
            <div style="margin-top:8px; opacity:0.6; font-size:11px;">
                Default Credentials: <strong>admin</strong> / <strong>admin</strong>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="/admin/js/admin-auth.js"></script>
    <script>
        // Redirect if already logged in
        AdminAuth.redirectIfAuth();

        var toggleBtn = document.getElementById('togglePasswordBtn');
        var passInput = document.getElementById('passwordInput');
        var toggleIcon = document.getElementById('toggleIcon');

        // Show/Hide Password Toggle
        toggleBtn.addEventListener('click', function() {
            if (passInput.type === 'password') {
                passInput.type = 'text';
                toggleIcon.classList.remove('fa-eye');
                toggleIcon.classList.add('fa-eye-slash');
            } else {
                passInput.type = 'password';
                toggleIcon.classList.remove('fa-eye-slash');
                toggleIcon.classList.add('fa-eye');
            }
        });

        // Form Submit
        var loginForm = document.getElementById('loginForm');
        var loginAlert = document.getElementById('loginAlert');
        var loginAlertText = document.getElementById('loginAlertText');
        var submitBtn = document.getElementById('submitLoginBtn');

        loginForm.addEventListener('submit', function(e) {
            e.preventDefault();
            var user = document.getElementById('usernameInput').value;
            var pass = passInput.value;
            var rem = document.getElementById('rememberMe').checked;

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa fa-spinner fa-spin"></i> Authenticating...';

            setTimeout(function() {
                var res = AdminAuth.login(user, pass, rem);
                if (res.success) {
                    window.location.href = '/admin/index.html';
                } else {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<span>Sign In to Dashboard</span> <i class="fa fa-arrow-right"></i>';
                    loginAlertText.textContent = res.message;
                    loginAlert.style.display = 'block';
                    passInput.focus();
                }
            }, 400);
        });

        document.getElementById('forgotPassBtn').addEventListener('click', function(e) {
            e.preventDefault();
            alert('Default credentials are:\nUsername: admin\nPassword: admin\n\nYou can change your password inside Admin Settings.');
        });
    </script>
</body>
</html>
